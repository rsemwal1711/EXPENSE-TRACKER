<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg" href="logo.png  " />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <!-- Primary Meta Tags -->
    <title>TrackMyCash - Smart Expense Tracker & Budget Manager</title>
    <meta name="title" content="TrackMyCash - Smart Expense Tracker & Budget Manager" />
    <meta name="description" content="Take control of your finances with TrackMyCash. Track expenses, set budgets, analyze spending patterns, and achieve your financial goals with our intuitive expense tracking app." />
    <meta name="keywords" content="expense tracker, budget manager, financial planning, money management, spending analysis, personal finance, expense tracking app" />
    <meta name="author" content="TrackMyCash Team" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trackmycash.app/" />
    <meta property="og:title" content="TrackMyCash - Smart Expense Tracker & Budget Manager" />
    <meta property="og:description" content="Take control of your finances with TrackMyCash. Track expenses, set budgets, analyze spending patterns, and achieve your financial goals." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://trackmycash.app/" />
    <meta property="twitter:title" content="TrackMyCash - Smart Expense Tracker & Budget Manager" />
    <meta property="twitter:description" content="Take control of your finances with TrackMyCash. Track expenses, set budgets, analyze spending patterns, and achieve your financial goals." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Theme and App -->
    <meta name="theme-color" content="#E8C547" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TrackMyCash" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TrackMyCash",
      "description": "Smart expense tracking and budget management application",
      "url": "https://trackmycash.app",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Expense Tracking",
        "Budget Management",
        "Spending Analytics",
        "Financial Goals",
        "Transaction History",
        "Multi-device Sync"
      ],
      "author": {
        "@type": "Organization",
        "name": "TrackMyCash Team"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
